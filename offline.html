<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLBASE - Perangkat Offline</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #F6F9FF;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #DCE5F2;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.12);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #DCEEFF;
      color: #2563EB;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .btn {
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&times;</div>
    <h1>Koneksi Terputus</h1>
    <p>Anda sedang berada dalam mode offline. Silakan periksa koneksi internet atau server lokal XAMPP Anda.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
